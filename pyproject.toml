[build-system]
requires = ['setuptools', 'setuptools-scm']
build-backend = 'setuptools.build_meta'

[project]
name = 'smartcrop'
version = '0.5.0'

# Metadata
authors = [
    {name = 'David Fischer', email = 'david@fisch3r.net'},
    {name = 'Hideo Hattori', email = 'hhatto.jp@gmail.com'}
]
description = 'smartcrop implementation in Python'
keywords = ['image', 'crop', 'PIL', 'Pillow']
readme = {file = 'README.md', content-type = "text/markdown"}
classifiers = [
    # https://pypi.python.org/pypi?%3Aaction=list_classifiers
    'Development Status :: 5 - Production/Stable',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Utilities'
]

# Requirements
requires-python = '>=3.12'
dependencies = [
    # The first releases to declare Python 3.12 support
    'numpy>=1.26.0',
    'pillow>=10.1.0',
]

[project.optional-dependencies]
test = [
    'colored>=2.2.4',         # 2024-03-19 Released 2023-12-19
    'coverage>=7.4.4',        # 2024-03-19 Released 2024-03-14
    'mypy>=1.9.0',            # 2024-03-19 Released 2024-03-08
    'pylint>=3.1.0',          # 2024-03-19 Released 2024-02-25
    'pytest>=8.1.1',          # 2024-03-19 Released 2024-03-09
    'pytest-cov>=4.1.0',      # 2024-03-19 Released 2023-05-24
    'pytest-ruff>=0.3.1',     # 2024-03-19 Released 2024-03-09
    'ruff>=0.3.3',            # 2024-03-19 Released 2024-03-15

    # For MyPy
    # Based on mypy --install-types
    'types-Pillow',
    'types-Pygments',
    'types-colorama',
    'types-setuptools'
]

[project.scripts]
smartcroppy = 'smartcrop.cli:main'

# ... other project metadata fields as specified in:
#     https://packaging.python.org/en/latest/specifications/declaring-project-metadata/

# [tool.setuptools-git-versioning]
# enabled = true

[project.urls]
homepage = 'https://github.com/smartcrop/smartcrop.py'
documentation = 'https://github.com/smartcrop/smartcrop.py'
repository = 'https://github.com/smartcrop/smartcrop.py'

[tool.setuptools.package-data]
smartcrop = ['py.typed']

[tool.pylint.'messages control']
disable = [
    'fixme',
    'logging-format-interpolation',
    'logging-fstring-interpolation',
    'missing-class-docstring',
    'missing-function-docstring',
    'missing-module-docstring',
    'multiple-imports',
    'useless-object-inheritance',
]
enable = ['c-extension-no-member']

[tool.pytest.ini_options]
addopts = [
    '--cov=smartcrop',
    '--cov-fail-under=75',
    '--cov-report=term-missing',
    '--cov-report=html',
    '--cov-report=xml',
    '--doctest-modules',
    '--ignore=examples',
    '--ruff',
    '--ruff-format',
]
doctest_optionflags = ['ELLIPSIS', 'NORMALIZE_WHITESPACE']

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['D', 'E', 'F', 'I', 'N', 'UP004', 'W']
ignore = [
    'D100',  # missing docstring in public module
    'D101',  # missing docstring in public class
    'D102',  # missing docstring in public method
    'D103',  # missing docstring in public function
    'D104',  # missing docstring in public package
    'D105',  # missing docstring in magic method
    'D106',  # missing docstring in public nested class
    'D107',  # missing docstring in __init__
    'D200',  # one-line docstring should fit on one line
    'D203',  # one blank line required before class docstring (conflicts with D211)
    'D204',  # one blank line required after class docstring
    'D205',  # one blank line required between summary and description
    'D212',  # multi-line docstring summary should start at first line
    'D400',  # first line should end with a period
    'N814',  # camelcase imported as constant
    'N999'   # invalid module name
]
